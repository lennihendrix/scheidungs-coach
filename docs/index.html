<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scheidungs-Coach</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root { --brand: #5B6EE8; --border: #E5E7EB; --bg: #F9FAFB; --muted: #6B7280; }

html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex; flex-direction: column; height: 100dvh;
  background: var(--bg);
}

/* header */
header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; background: #fff;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 700; color: var(--brand); }
header span { font-size: 11px; color: var(--muted); }
header button {
  margin-left: auto; background: none; border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 12px; font-size: 12px;
  color: var(--muted); cursor: pointer; touch-action: manipulation;
}

/* status bar */
#status {
  font-size: 12px; color: #fff; text-align: center;
  padding: 6px; flex-shrink: 0; display: none;
}
#status.ok  { background: #16a34a; }
#status.err { background: #dc2626; }

/* messages */
#msgs {
  flex: 1; min-height: 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
}
.msg { display: flex; gap: 8px; max-width: 85%; }
.msg.ai   { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.av {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.ai   .av { background: #EEF0FD; }
.user .av { background: #FEE2E2; }
.bbl {
  padding: 10px 13px; border-radius: 14px;
  font-size: 14px; line-height: 1.6; word-break: break-word;
}
.ai   .bbl { background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 3px; }
.user .bbl { background: var(--brand); color: #fff; border-bottom-right-radius: 3px; }

/* typing */
.dots { display: flex; gap: 4px; padding: 4px 0; }
.dots span {
  width: 7px; height: 7px; background: var(--muted);
  border-radius: 50%; animation: b .8s infinite;
}
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes b { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

/* input */
#input-row {
  display: flex; gap: 8px; padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background: #fff; border-top: 1px solid var(--border); flex-shrink: 0;
}
textarea {
  flex: 1; border: 2px solid var(--border); border-radius: 12px;
  padding: 10px 13px; font-size: 16px; font-family: inherit;
  resize: none; max-height: 120px; line-height: 1.4; background: #fff;
}
textarea:focus { outline: none; border-color: var(--brand); }
#send {
  width: 44px; height: 44px; border-radius: 12px; border: none;
  background: var(--brand); color: #fff; font-size: 18px;
  cursor: pointer; flex-shrink: 0; align-self: flex-end;
  touch-action: manipulation;
}
#send:disabled { background: var(--border); }
</style>
</head>
<body>

<header>
  <div>
    <h1>⚖️ Scheidungs-Coach</h1>
    <span id="ver"></span>
  </div>
  <button onclick="doLogout()">Abmelden</button>
</header>

<div id="status"></div>

<div id="msgs"></div>

<div id="input-row">
  <textarea id="inp" rows="1" placeholder="Schreib mir…"
    oninput="resize(this)"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
  ></textarea>
  <button id="send" onclick="send()">➤</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB  = 'https://faodupnfqvugeeftjfbi.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhb2R1cG5mcXZ1Z2VlZnRqZmJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4OTM4OTEsImV4cCI6MjA5MjQ2OTg5MX0.Al25wuVNxIDcyZSiLcbQKvrqr2itH-hasET2Rg2uf8w';
const FN  = SB + '/functions/v1';
const sb  = window.supabase.createClient(SB, KEY);

let msgs = [], busy = false, uid, token;

fetch('version.json').then(r=>r.json()).then(d=>{ document.getElementById('ver').textContent='v'+d.version }).catch(()=>{});

function flash(msg, ok=true) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = ok ? 'ok' : 'err'; el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function doLogout() { sb.auth.signOut().finally(() => location.href = 'login.html'); }

// ── DB ──
async function save() {
  const res = await fetch(`${SB}/rest/v1/chat_sessions?on_conflict=user_id`, {
    method: 'POST',
    headers: {
      'apikey': KEY, 'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify({ user_id: uid, profile: {}, messages: msgs, updated_at: new Date().toISOString() }),
  });
  if (!res.ok) {
    const t = await res.text();
    flash('Speichern fehlgeschlagen: ' + res.status + ' ' + t, false);
    console.error('save', res.status, t);
  }
}

async function load() {
  const res = await fetch(`${SB}/rest/v1/chat_sessions?select=messages&user_id=eq.${uid}&limit=1`, {
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + token },
  });
  if (!res.ok) { console.error('load', res.status); return []; }
  const rows = await res.json();
  return Array.isArray(rows[0]?.messages) ? rows[0].messages : [];
}

// ── UI ──
function bubble(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'assistant' ? 'ai' : 'user');
  d.innerHTML = `<div class="av">${role==='assistant'?'🤝':'🙂'}</div><div class="bbl">${esc(text)}</div>`;
  document.getElementById('msgs').appendChild(d);
  document.getElementById('msgs').scrollTop = 99999;
  return d.querySelector('.bbl');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function resize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text || busy) return;
  inp.value = ''; resize(inp);
  busy = true; document.getElementById('send').disabled = true;

  bubble('user', text);
  msgs.push({ role: 'user', content: text });

  // typing indicator
  const ti = document.createElement('div');
  ti.className = 'msg ai'; ti.id = 'ti';
  ti.innerHTML = '<div class="av">🤝</div><div class="bbl"><div class="dots"><span></span><span></span><span></span></div></div>';
  document.getElementById('msgs').appendChild(ti);
  document.getElementById('msgs').scrollTop = 99999;

  try {
    const res = await fetch(`${FN}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KEY },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 1024, stream: true,
        system: 'Du bist ein einfühlsamer Scheidungs-Coach. Sei empathisch, konkret, duze immer, antworte auf Deutsch.',
        messages: msgs.slice(-50).map(m => ({ role: m.role, content: m.content })),
      }),
    });

    document.getElementById('ti')?.remove();

    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      bubble('assistant', 'Fehler ' + res.status + ': ' + (e?.error?.message || ''));
    } else {
      const bbl = bubble('assistant', '');
      let full = '', buf = '';
      const reader = res.body.getReader(), dec = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') continue;
          try {
            const ev = JSON.parse(raw);
            if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
              full += ev.delta.text;
              bbl.innerHTML = esc(full);
              document.getElementById('msgs').scrollTop = 99999;
            }
          } catch (_) {}
        }
      }
      msgs.push({ role: 'assistant', content: full });
      await save();
    }
  } catch (e) {
    document.getElementById('ti')?.remove();
    bubble('assistant', 'Verbindungsfehler: ' + e.message);
  }

  busy = false;
  document.getElementById('send').disabled = false;
  document.getElementById('inp').focus();
}

// ── INIT ──
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }

  uid   = session.user.id;
  token = session.access_token;

  msgs = await load();

  const box = document.getElementById('msgs');
  if (msgs.length === 0) {
    bubble('assistant', 'Hallo! Ich bin dein Scheidungs-Coach. Was beschäftigt dich gerade?');
    msgs = []; // don't persist the welcome message
  } else {
    msgs.forEach(m => bubble(m.role, m.content));
    setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
  }
})();
</script>
</body>
</html>
