<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrieren – Scheidungs-Coach</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon">⚖️</div>
    <h1>Scheidungs-Coach</h1>
    <p>Dein persönlicher Begleiter</p>
  </div>

  <div class="auth-title">Konto erstellen</div>
  <div class="auth-sub">Erstelle ein kostenloses Konto und fühl dich nicht mehr allein mit deinen ganzen Fragen.</div>

  <div class="alert" id="alert"></div>

  <form id="signup-form" onsubmit="handleSignup(event)">
    <div class="form-group">
      <label class="form-label" for="name">Vorname</label>
      <input class="form-input" id="name" type="text" placeholder="Dein Vorname" required autocomplete="given-name" />
    </div>
    <div class="form-group">
      <label class="form-label" for="email">E-Mail</label>
      <input class="form-input" id="email" type="email" placeholder="du@beispiel.de" required autocomplete="email" />
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Passwort</label>
      <div class="input-wrap">
        <input class="form-input" id="password" type="password" placeholder="Mind. 8 Zeichen" required autocomplete="new-password" minlength="8" />
        <button type="button" class="toggle-pw" onclick="togglePw('password', this)">👁️</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="password2">Passwort bestätigen</label>
      <div class="input-wrap">
        <input class="form-input" id="password2" type="password" placeholder="Passwort wiederholen" required autocomplete="new-password" />
        <button type="button" class="toggle-pw" onclick="togglePw('password2', this)">👁️</button>
      </div>
    </div>
    <button class="btn btn-primary" id="submit-btn" type="submit">Konto erstellen</button>
  </form>

  <div class="auth-switch">
    Bereits registriert? <a href="login.html">Jetzt anmelden</a>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://faodupnfqvugeeftjfbi.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhb2R1cG5mcXZ1Z2VlZnRqZmJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4OTM4OTEsImV4cCI6MjA5MjQ2OTg5MX0.Al25wuVNxIDcyZSiLcbQKvrqr2itH-hasET2Rg2uf8w';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Already logged in? Redirect to app
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = 'index.html';

  window.togglePw = (id, btn) => {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁️' : '🙈';
  };

  window.handleSignup = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alertEl = document.getElementById('alert');
    alertEl.className = 'alert';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    const pw2 = document.getElementById('password2').value;

    if (pw !== pw2) {
      alertEl.textContent = 'Die Passwörter stimmen nicht überein.';
      alertEl.className = 'alert error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Konto wird erstellt…';

    const { data, error } = await supabase.auth.signUp({
      email,
      password: pw,
      options: { data: { full_name: name } }
    });

    if (error) {
      const msg = error.message.includes('already registered') || error.message.includes('already been registered')
        ? 'Diese E-Mail ist bereits registriert. <a href="login.html">Jetzt anmelden →</a>'
        : error.message;
      alertEl.innerHTML = msg;
      alertEl.className = 'alert error';
      btn.disabled = false;
      btn.textContent = 'Konto erstellen';
      return;
    }

    // If session exists → auto-confirm is on → go straight to app
    if (data.session) {
      window.location.href = 'index.html';
      return;
    }

    // Otherwise email confirmation required
    alertEl.textContent = '✅ Fast geschafft! Bitte bestätige deine E-Mail-Adresse, dann kannst du dich anmelden.';
    alertEl.className = 'alert success';
    btn.textContent = 'Konto erstellt ✓';
  };
</script>
</body>
</html>
