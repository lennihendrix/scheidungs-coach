<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrieren – Scheidungsmentor</title>
<link rel="stylesheet" href="auth.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Scheidungsmentor">
<meta name="theme-color" content="#5B6EE8">
<!-- Google tag (gtag.js) - Google Ads AW-1059058271 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-1059058271"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-1059058271');
  // Signup-Conversion an Google Ads melden. LABEL noch einsetzen!
  window.GADS_SIGNUP_SEND_TO = 'AW-1059058271/JCQuCOC0mL0dEN_k__gD';
  window.trackSignupConversion = function(){
    return new Promise(function(resolve){
      var done = false, finish = function(){ if(!done){ done = true; resolve(); } };
      try { gtag('event', 'conversion', { send_to: window.GADS_SIGNUP_SEND_TO, event_callback: finish }); }
      catch(e){ finish(); return; }
      setTimeout(finish, 800); // Fallback, falls kein Callback kommt
    });
  };
</script>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon"><a href="landing.html" title="Zur Startseite"><img src="favicon.svg" alt="" style="width:56px;height:56px;display:block;margin:0 auto;border-radius:13px"></a></div>
    <h1>Scheidungsmentor</h1>
    <p>24/7 für dich da</p>
  </div>

  <div class="auth-title">Kostenlos starten</div>
  <div class="auth-sub">Nur E-Mail und Passwort — in 20 Sekunden drin. 7 Tage gratis, keine Kreditkarte.</div>

  <div class="alert" id="alert"></div>

  <form id="signup-form" onsubmit="handleSignup(event)">
    <div class="form-group">
      <label class="form-label" for="email">E-Mail</label>
      <input class="form-input" id="email" type="email" placeholder="du@beispiel.de" required autocomplete="email" />
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Passwort</label>
      <div class="input-wrap">
        <input class="form-input" id="password" type="password" placeholder="Mind. 8 Zeichen" required autocomplete="new-password" minlength="8" />
        <button type="button" class="toggle-pw" onclick="togglePw('password', this)">👁️</button>
      </div>
    </div>
    <button class="btn btn-primary" id="submit-btn" type="submit">Kostenlos starten →</button>
  </form>

  <div class="trust-row">🔒 100% anonym · Keine Datenweitergabe · Jederzeit kündbar</div>

  <div class="auth-switch">
    Bereits registriert? <a href="login.html">Jetzt anmelden</a>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://faodupnfqvugeeftjfbi.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhb2R1cG5mcXZ1Z2VlZnRqZmJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4OTM4OTEsImV4cCI6MjA5MjQ2OTg5MX0.Al25wuVNxIDcyZSiLcbQKvrqr2itH-hasET2Rg2uf8w';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Gewählter Tarif von der Landingpage (?plan=easy|intensiv)
  const planParam = new URLSearchParams(window.location.search).get('plan');
  const nextUrl = (planParam === 'easy' || planParam === 'intensiv')
    ? `index.html?checkout=${planParam}` : 'index.html';

  // Already logged in? Redirect to app (ggf. direkt zum Checkout)
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = nextUrl;

  window.togglePw = (id, btn) => {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁️' : '🙈';
  };

  window.handleSignup = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alertEl = document.getElementById('alert');
    alertEl.className = 'alert';

    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Konto wird erstellt…';

    const { data, error } = await supabase.auth.signUp({ email, password: pw });

    if (error) {
      const msg = error.message.includes('already registered') || error.message.includes('already been registered')
        ? 'Diese E-Mail ist bereits registriert. <a href="login.html">Jetzt anmelden →</a>'
        : error.message;
      alertEl.innerHTML = msg;
      alertEl.className = 'alert error';
      btn.disabled = false;
      btn.textContent = 'Kostenlos starten →';
      return;
    }

    // Google Ads: Signup-Conversion melden (und auf Bestätigung warten, bevor weitergeleitet wird)
    if (window.trackSignupConversion) await window.trackSignupConversion();

    // If session exists → auto-confirm is on → go straight to app (ggf. Checkout)
    if (data.session) {
      window.location.href = nextUrl;
      return;
    }

    // Otherwise email confirmation required
    alertEl.textContent = '✅ Fast geschafft! Bitte bestätige deine E-Mail-Adresse, dann kannst du dich anmelden.';
    alertEl.className = 'alert success';
    btn.textContent = 'Konto erstellt ✓';
  };
</script>
</body>
</html>
